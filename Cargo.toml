[workspace]
resolver = "2"
members = [
    "crates/are-core",
    "crates/are-client",
    "crates/are-daemon",
    "crates/are-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.78"
license = "MIT OR Apache-2.0"
repository = "https://github.com/are-project/are"
description = "Agent Remote Environment"

[workspace.dependencies]
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-trait = "0.1"
tokio = { version = "1", features = ["full"] }
rustls = { version = "0.23", default-features = false, features = ["std", "ring", "logging"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
rustls-pemfile = "2"
rcgen = "0.13"
rustls-webpki = "0.102"
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
hostname = "0.4"
tempfile = "3"
are-core = { path = "crates/are-core" }
are-client = { path = "crates/are-client" }

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
